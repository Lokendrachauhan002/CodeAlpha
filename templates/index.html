<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusAssist | College FAQ Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="container py-3 py-md-5"><section class="chat-card mx-auto">
    <header class="chat-header d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3"><div class="brand-avatar">CA</div><div><h1>CampusAssist</h1><p><span class="online-dot"></span> AI-powered college FAQ assistant</p></div></div>
      <div class="d-flex gap-1"><button id="faqButton" class="btn btn-sm header-btn" title="Browse FAQs">FAQs</button><button id="themeButton" class="btn btn-sm header-btn" title="Toggle theme">☾</button><button id="clearButton" class="btn btn-sm header-btn" title="Clear chat">Clear</button></div>
    </header>
    <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
    <div id="suggestionBar" class="suggestion-bar"></div>
    <form id="chatForm" class="chat-input" novalidate>
      <input id="messageInput" class="form-control" maxlength="500" autocomplete="off" placeholder="Ask about admissions, fees, exams..." aria-label="Your question">
      <button class="btn btn-send" type="submit">Send <span class="send-icon">➤</span></button>
    </form>
    <footer><span>Enter to send · Shift+Enter for a new line</span><button id="exportButton" class="btn btn-link btn-sm">Export chat</button></footer>
  </section></main>
  <div class="modal fade" id="faqModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5">Search FAQs</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="faqSearch" class="form-control mb-3" placeholder="Search a topic"><div id="faqResults"></div></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
